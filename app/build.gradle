plugins { id 'com.android.application' }

android {
    namespace 'com.batz.syncwatch'
    compileSdk 36
    defaultConfig {
        applicationId 'com.batz.syncwatch'
        minSdk 26
        targetSdk 35
        versionCode 4
        versionName '1.2.1'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        ndk {
            // Default download for current phones; CI opts into all ABIs for x86_64 instrumentation.
            if (providers.gradleProperty('universal').getOrElse('false').toBoolean()) {
                abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
            } else {
                abiFilters 'arm64-v8a'
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint { abortOnError true }
    testOptions { unitTests.returnDefaultValues = true }
}
dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'org.videolan.android:libvlc-all:3.7.7'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    androidTestImplementation 'androidx.test:core:1.6.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
