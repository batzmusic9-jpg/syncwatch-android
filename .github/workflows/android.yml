name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Test, lint and build installable APK
        run: gradle --no-daemon testDebugUnitTest lintDebug assembleDebug
      - name: Create synthetic playback fixture
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          mkdir -p app/src/androidTest/assets
          ffmpeg -hide_banner -loglevel error -f lavfi -i testsrc=size=160x90:rate=15 -f lavfi -i sine=frequency=440:sample_rate=44100 -t 20 -c:v libx264 -pix_fmt yuv420p -c:a aac app/src/androidTest/assets/sync-test.mp4
      - name: Enable emulator acceleration
        run: |
          sudo chown "$USER" /dev/kvm
      - name: Run playback integration test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            gradle --no-daemon connectedDebugAndroidTest
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -n com.batz.syncwatch/.MainActivity
            sleep 2
            adb shell screencap -p /sdcard/syncwatch.png
            adb pull /sdcard/syncwatch.png app/build/reports/syncwatch.png
            adb shell settings put system accelerometer_rotation 0
            adb shell settings put system user_rotation 1
            sleep 2
            adb shell screencap -p /sdcard/fullscreen.png
            adb pull /sdcard/fullscreen.png app/build/reports/fullscreen.png
      - name: Verify and package APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/SyncWatch-1.1.0.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose dist/SyncWatch-1.1.0.apk
          cd dist
          sha256sum SyncWatch-1.1.0.apk > SHA256SUMS.txt
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SyncWatch-APK
          path: dist/
          if-no-files-found: error
          retention-days: 30
      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Validation-reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
